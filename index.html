i pula, memangnya aku bisa berbuat apa? Aku tidak akan pernah mencapai apa-apa. Dan entah sampai kapan aku bisa terus bekerja begini.\"\n\nGadis itu tertawa lembut. \"Jangan meremehkan dirimu sendiri. Ada potensi luar biasa di dalam dirimu. Dan suatu hari nanti... takdir kita akan saling terjalin.\"\n\n*Takdir? Terjalin? Maksudnya apa? Apa dia... melamarku? Tidak, tidak mungkin. Gila. ...Tapi mungkin saja, kan? Siapa tahu...*\n\n\"Ehm, um... D-dengar, ya... M-maukah kamu makan malam denganku kapan-kapan? Aku tahu restoran yang bagus—\"\n\nAku mengangkat wajah. Tidak ada siapa pun di sana.\n\n## Senja dan Satu Pertanyaan\n\n\"Hah?! Huuuh?! Tadi itu apa? Halusinasi?!\"\n\nAku berlari keluar, napas tersengal. Navi menyambutku dengan nada tak berubah. \"Nona Nagiboshi, ada apa gerangan keributan ini?\"\n\n\"A-ada seorang gadis. Tapi dia menghilang begitu saja, seperti ditelan udara. Mungkin dia ninja.\"\n\n\"Ya, ya, bagus sekali untuk Anda. Omong-omong, matahari mulai terbenam. Sebaiknya kita kembali.\"\n\n\"Tunggu, kamu benar-benar tidak melihatnya?! Masa...\"\n\nAku menoleh ke arah bangunan tua itu. Cahaya jingga menimpa dindingnya, memantul di permukaan air yang tenang, dan tidak ada tanda-tanda siapa pun pernah berdiri di sana.\n\n*Aku penasaran... apakah aku akan bertemu dengannya lagi.*"}, {"title": "Permintaan dari Idola", "tone": "sunset", "synopsis": "Kapal hampir menabrak, perangkap penuh ikan, dan telepon yang mengubah segalanya.", "body": "## Terbang Tanpa Arah\n\n\"Nona Nagiboshi! Kita akan menabrak sesuatu kapan saja kalau Anda tidak mengubah arah!\"\n\nSuara Navi memecah lamunanku. Aku tersentak dan buru-buru membanting kemudi, hanya sempat melihat bayangan gedung berlumut lewat tipis di samping kapal.\n\n\"Apa yang membuat Anda begitu terganggu? Kalau Anda tetap bersikeras mengemudi sendiri seperti ini, saya terpaksa mendaftarkan Anda ke paket autopilot.\"\n\n\"Iya, iya, aku konsentrasi, kok.\"\n\n\"Dan Anda masih belum menyerahkan laporan Anda.\"\n\nAku pura-pura tidak mendengar.\n\n## Perangkap dan Makan Malam\n\nSebelum pulang, aku mampir memeriksa perangkap ikan yang kupasang. Isinya cukup memuaskan: ikan damsel perut kuning, dottyback merah menyala, ikan kupu-kupu benang bersirip pipih, dan beberapa kepiting pantai belang yang mondar-mandir panik. Sejak Banjir Besar, laut jadi jauh lebih ramai oleh ikan.\n\nAku sengaja tidak memikirkan apa yang mereka makan di bawah sana.\n\nAku masuk ke kamar sambil menenteng keranjang yang penuh tak seperti biasanya. Setelah mandi dan berganti pakaian, pikiranku sibuk menyusun menu makan malam yang mewah. *Apa yang sebaiknya kubuat? Tempura? Tidak, mungkin lebih baik...*\n\nTiba-tiba gambar gadis itu muncul lagi di kepalaku. *Ahhh! Aku tidak percaya aku lupa menanyakan namanya!*\n\nAku menghela napas panjang. *Aku penasaran apakah aku bisa bertemu dengannya lagi. Aku benar-benar menyia-nyiakan kesempatan...*\n\n*Tidak, tidak. Aku harus berhenti memikirkannya!* Aku menggeleng keras. *Aku tahu hal yang pas untuk mengalihkan pikiran.*\n\nMakan malam ternyata jadi enak sekali, dan sambil makan aku membuka ponsel. *Sepertinya siaran Lilly sudah mulai.*\n\n## Siaran Lilly Candy\n\n\"Sugar, sugar! Momen manis dariku untukmu! Ini Lilly Candy, kesayangan kalian! Apa kabar semua sayang-sayangku?\"\n\nAku langsung tersenyum lebar. *Eep, Lilly kelihatan imut dan keren banget.*\n\n\"Coba tebak, hari ini aku ada di mana? Sebenarnya, aku akan turun ke permukaan dan melakukan siaran yang sudah lama kurencanakan. Aku menamainya... tunggu dulu... *The Real Horror*!\"\n\nLilly mengedipkan mata ke kamera. \"Kalian suka cerita horor, nggak? Kalian tahu tempat kelahiran horor? Di sana ada banyak sekali legenda urban yang super menyeramkan. Tapi yang paling bikin aku penasaran adalah legenda manusia ikan.\"\n\nAku mengerutkan dahi. *Manusia ikan?*\n\n\"Menurut legendanya, ada manusia ikan raksasa yang tinggal di menara radio yang tenggelam, dan dia memakan anak-anak perempuan! Ooh, dan dengar ini! Untuk bisa sampai ke sana...\"\n\n*Aku sama sekali tidak tahu ada legenda seperti itu. Siapa pun yang akan Lilly mintai tolong, mereka pasti pilot yang luar biasa hebat.*\n\n\"Aku sempat mencari-cari informasi di internet,\" lanjut Lilly ceria. \"Dan aku menemukan seorang gadis bernama Sorana Nagiboshi!\"\n\n\"Sorana Nagiboshi, ya?\" gumamku. \"Tunggu, rasanya aku pernah dengar nama itu...\"\n\nAku membeku. *So-ra-na Na-gi-bo-shi...*\n\n*Tidak mungkin dia sedang membicarakan aku.* Aku menarik napas dalam-dalam. *Tenang dulu, pikir baik-baik. Pasti cuma salah paham.*\n\n\"Nah, ini dia! Aku akan coba meneleponnya sekarang juga!\"\n\nPonselku bergetar.\n\n## Panggilan yang Mengubah Segalanya\n\n*Tidak mungkin... Ini benar-benar terjadi?!* Dengan tangan gemetar aku mengangkatnya. \"H-halo? A-apakah ini Lilly?\"\n\n\"Halo, Sorana! Akhirnya tersambung!\"\n\n\"A-aku selalu menonton siaranmu, j-jadi...\"\n\n\"Wah, nggak mungkin! Aku senang sekali dengarnya! Kamu sedang menonton sekarang?\" Lilly tertawa kecil. \"Tapi kamu nggak perlu setegang itu, tahu.\"\n\nAku menelan ludah.\n\n\"Nah, kamu pasti sudah tahu kenapa aku menelepon, kan? Kalau begitu, anggap ini permintaan resmiku agar kamu menjadi pilot kapal selamku.\"\n\n\"A-apakah kamu yakin menginginkanku?\"\n\n\"Tentu saja! Kamu satu-satunya orang yang cocok untuk pekerjaan ini, Sorana!\"\n\n\"K-kalau begitu, daftarkan aku! Siang atau malam, aku siap!\"\n\n\"Yay, aku sudah berharap kamu bilang begitu! Aku tahu ini agak mendadak, tapi bagaimana kalau besok? Bisa?\"\n\n*Besok?! Guaaah! Semuanya terjadi terlalu cepat!*\n\n\"B-bisa! A-aku bisa mengatur waktunya!\"\n\nSetelah sambungan terputus, aku terduduk lemas. *I-ini besar. Ini benar-benar besar.*\n\n## Pemeriksaan Tengah Malam\n\nMalam itu, aku menyelinap ke hanggar dan menyalakan lampu. Navi menyambutku dengan nada datar yang sama.\n\n\"Oh? Apa yang Anda lakukan di sini pada jam seperti ini?\"\n\n\"Kupikir sudah waktunya kamu diperiksa secara menyeluruh!\"\n\n\"Saya sangat setuju, tetapi laporan Anda tidak akan menulis dirinya sendiri...\"\n\n\"Laporan itu bisa menunggu! Sekarang diam dulu dan biarkan aku bekerja!\"\n\nAku menggulung lengan baju dan mulai memeriksa kapal selam itu dengan semangat yang belum pernah kutunjukkan sebelumnya. Besok, aku akan membawa seorang idola ke bawah laut."}, {"title": "Pertemuan di Pelabuhan Antariksa", "tone": "sunset", "synopsis": "Latihan memperkenalkan diri di depan cermin, pelukan yang melumpuhkan, dan kapal selam satu kursi.", "body": "## Latihan di Depan Cermin\n\nPagi itu aku berdiri di depan cermin, memutar badan ke kiri dan ke kanan. *Apa penampilanku sudah cukup baik? Oh, mungkin sebaiknya aku latihan memperkenalkan diri dulu...*\n\nAku berdeham. \"Baiklah, mulai... 'Salam kenal. Saya Sorana Nagiboshi. Terima kasih sudah mempekerjakan saya untuk peran ini.'\"\n\nHening.\n\n\"Tidak, tadi itu aneh banget. Harusnya bilang apa, ya?\"\n\nAku mencoba beberapa kalimat lain, dan tidak satu pun terdengar benar. *Aduh, inilah akibatnya karena aku tidak pernah repot-repot berinteraksi dengan orang lain. Rasanya aku lupa bagaimana caranya bicara.*\n\n*Mungkin aku harus mencoba sesuatu yang baru? Tidak... sekarang bukan saatnya mencoba hal baru. Tidak ada kemungkinan skenario yang berjalan lancar kalau begitu.*\n\nLalu mataku menangkap pantulan baju kerja yang kupakai. *Tapi lihat aku! Bagaimana bisa aku menemui Lilly dengan pakaian seperti ini?!*\n\n*Andai saja aku lebih tertarik pada fashion... Urgh, kenapa aku harus seperti ini?*\n\n\"Pengingat dengan hormat,\" suara Navi menyela dari speaker, \"pengoperasian kapal selam apa pun harus dilakukan dengan pakaian kerja yang sesuai.\"\n\n\"Hei, benar juga! Itu poin bagus! Siapa yang bisa menyalahkan gadis yang memakai baju kerja untuk bekerja?\"\n\nAku tersenyum puas, lalu bertanya, \"Hei, butuh berapa lama untuk sampai ke pelabuhan antariksa?\"\n\n\"Tiga puluh menit dengan kapal selam.\"\n\n\"Oke. Dia dijadwalkan tiba jam sepuluh pagi, jadi masih banyak waktu.\" Aku menggaruk kepala. *Hmm... apa lagi yang perlu kupersiapkan?*\n\n## Dermaga yang Dulunya Kapal Tanker\n\nPelabuhan antariksa Kepulauan Kapal sebenarnya hanyalah sebuah kapal tanker super tua yang terbengkalai. Masa mengangkut minyaknya sudah lama berlalu, dan kapal raksasa itu kini berfungsi sebagai landasan bagi pesawat ruang angkasa berukuran kecil.\n\nAku berdiri di tepi geladak, menunggu. Dari pengeras suara terdengar pengumuman, \"Memulai hitung mundur pendaratan. Harap menjauh dari geladak selama proses berlangsung.\"\n\nAku mundur beberapa langkah dan merapikan rambut dengan gugup. *Apa pakaian ini benar-benar tidak masalah? Rambutku tidak aneh, kan?*\n\n*Tapi... apa aku benar-benar bisa melakukan ini? Apa aku bisa bicara dengannya seperti orang normal?*\n\nPesawat kecil itu mendarat dengan mulus di geladak. Pintunya terbuka, dan seorang gadis melompat turun dengan senyum lebar.\n\n## Pelukan yang Melumpuhkan\n\n\"Eh heh heh... I-iya, um, i-itu saya...\" kataku saat ia menyebut namaku. \"T-terima kasih... sudah mempekerjakan saya untuk... un-untuk p-peran ini!\"\n\n*Ahhh! Suaraku gemetar!*\n\n*Dan aku bisa merasakan wajahku memerah! Ini mengerikan!*\n\n\"Aku Lilly Candy. Senang bertemu denganmu, partner!\"\n\n\"Ywaaah?!\"\n\nSebelum aku sempat bereaksi, Lilly memelukku erat. \"Nah, pelukan yang lebih besar pasti bisa menenangkanmu!\"\n\n*Whaaa?! Ini benar-benar terjadi?!*\n\n\"Jadi? Sudah merasa lebih baik?\"\n\n\"O-oke...\" Aku menelan ludah, wajahku panas sampai ke telinga. \"K-kapal selamku ada di dermaga. B-biar kutunjukkan jalannya.\"\n\n## Laut yang Membuat Pusing\n\nBegitu kami keluar ke sisi kapal tanker yang menghadap laut, Lilly berhenti mendadak.\n\n\"Tidak! Mungkin! Itu laut?! Indah banget!\"\n\n\"A-apa ini pertama kalinya kamu melihatnya?\"\n\n\"Di koloni kami ada yang buatan, sih... Tapi aku belum pernah melihat yang sebesar dan seluas ini.\" Ia memandang hamparan biru itu lama sekali. \"Aku mau memandanginya selamanya, tapi aku mulai merasa pusing.\"\n\n\"P-pusing? Kenapa? Apa kamu mabuk perjalanan?\"\n\n\"Bukan, bukan, bukan seperti itu! Gravitasi buatan di koloni itu... jadi kamu terbiasa merasakan hal-hal seperti gaya pasang surut dan gaya Coriolis. Tapi di sini tidak ada. Rasanya seperti terus-menerus mengalami percepatan, tapi tidak ada yang bergeser saat aku bergerak. Aneh banget! Dan karena aku belum pernah melihat ruang terbuka seluas ini... otakku jadi agak kacau.\"\n\n\"Surface sickness,\" kata Lilly. \"Begitu namanya.\"\n\n\"O-oh tidak, kedengarannya mengerikan! Kamu baik-baik saja? B-bisa kuambilkan obat?\"\n\n*Oh, aku mengerti... Di koloni luar angkasa, gaya Coriolis menggeser tubuh orang-orang saat bergerak.*\n\n\"Aku sebenarnya ingin terus menatap pemandangan ini,\" kata Lilly sambil menyeka dahinya.\n\nAku mengangguk. \"Ya, di sini suhunya paling sedikit 110 derajat setiap hari. Berbahaya kalau terlalu lama berada di luar.\"\n\n\"Kalau begitu, ayo kita ke kapal selam?\"\n\n## Kapal Selam Satu Kursi\n\n\"Ini kapal selamku, Coral Seeker Beta,\" kataku. \"Walaupun sebenarnya bukan milikku. Aku hanya menyewanya...\"\n\n\"Wah, ini Nona Lilly, sang streamer terkenal!\" seru Navi dengan nada yang sama sekali berbeda dari biasanya. \"Merupakan kehormatan besar bagi saya untuk menjadi pemandu bagi selebritas seperti Anda. Dengan risiko terdengar lancang, apakah Anda berkenan menandatangani lambung saya?\"\n\nAku melongo. \"Perlakuan istimewa banget, ya! Kamu nggak pernah ngomong sehalus itu padaku!\"\n\n\"Apa yang Anda harapkan? Nona Lilly adalah seorang selebritas. Dan saya adalah model bahasa besar. Karenanya, saya mengikuti distribusi probabilitas dari korpus teks saya. Percakapan dengan orang biasa dan percakapan dengan selebritas pasti berbeda dalam distribusi probabilitas kata-katanya. Maka, keluaran ucapan saya pun sangat berbeda.\"\n\n\"Hei, aku juga diciptakan dari...\" Lilly mulai tertawa, lalu mengangguk puas. \"Ya, kamu benar sekali! Itu masuk akal!\"\n\n*Urgh, ini bikin merinding...*\n\n\"Saya mohon maaf mengganggu momen mengharukan ini,\" sela Navi. \"Namun saya harus menegaskan bahwa saya hanyalah kapal selam satu tempat duduk. Tidak ada kursi penumpang di dalam.\"\n\nAku dan Lilly saling pandang.\n\n\"Tenang, aku punya ide!\" kata Lilly sambil tersenyum lebar. \"Ayo, duduk saja.\"\n\nAku menurut, masih tidak mengerti. Dan sebelum otakku sempat memproses apa pun, Lilly sudah duduk di pangkuanku.\n\n*Guah?! L-Lilly duduk di pangkuanku?!*"}, {"title": "Menara Radio di Balik Badai", "tone": "sunset", "synopsis": "Menyusuri kota di atas air, semangkuk ramen, dan kenangan hari badai yang tak pernah pergi.", "body": "## Menyusuri Kota di Atas Air\n\nKapal selam kecil kami meluncur pelan di antara deretan bangunan yang menjulang dari permukaan laut. Lilly, yang masih duduk di pangkuanku, tak berhenti menoleh ke segala arah.\n\n\"Aku suka banget sama tiang-tiang kecil yang lucu itu!\"\n\n\"Itu menara pembangkit angin,\" jelasku. \"Dibuat supaya bisa menghasilkan listrik dari angin laut... jadi kota ini bisa tetap menyala tanpa bergantung pada daratan.\"\n\n\"Wah, keren! Kalau yang itu? Yang bentuknya seperti ujung jarum raksasa itu?\"\n\n\"Itu menara pemanen air atmosfer. Air tawar di sini begitu berharga sampai kami harus memanennya dari udara dengan menara-menara itu.\"\n\n\"Wow! Semuanya di sini menarik banget!\" Lilly terkekeh, lalu memegangi perutnya. \"Tapi sightseeing begini bikin aku lapar.\"\n\n## Kedai Ramen Terapung\n\n\"Oh, di sana ada kedai ramen terapung,\" kataku sambil menunjuk. \"Mau mampir?\"\n\nKami merapat ke kedai kayu kecil yang mengapung di atas permukaan air, aroma kuahnya tercium sampai ke geladak. Lilly menatap menu dengan mata berbinar. \"Ramen dengan rumput laut? Segar banget!\"\n\n\"Ya, karena selada lautnya ditanam persis di belakang kedai. Jadi selalu segar.\"\n\n\"Harga seperti ini bakal sangat mahal di tempatku! Aku harus coba ini!\"\n\nSambil menunggu mangkuk kami, aku menunjuk rak kecil di sudut kedai. \"Mereka juga menjual suvenir, kalau kamu tertarik.\"\n\nKami makan sambil mengobrol santai, dan untuk pertama kalinya hari itu aku tidak merasa gugup. Hingga akhirnya aku teringat sesuatu.\n\n\"Ngomong-ngomong, soal cerita manusia ikan itu... kok kamu bisa tertarik?\"\n\n\"Oh, itu terkenal banget, tahu! Bahkan ada game buatan penggemar tentang itu!\"\n\n\"Aku tidak pernah menyangka itu terinspirasi dari legenda sungguhan...\"\n\n\"Nah, sekarang kamu tahu!\" Lilly menyeruput kuahnya, lalu merendahkan suara. \"Yang kudengar, ada seorang penjaga di akuarium menara radio yang jatuh cinta pada salah satu ikan di sana... Sampai-sampai dia memberi makan ikan itu dengan dagingnya sendiri...\"\n\nAku hampir menjatuhkan sumpitku.\n\n## Jalan Memutar\n\nSetelah makan, aku membuka peta kapal dan memeriksa lokasi menara radio. \"Ummm... biar kulihat dulu lokasinya...\"\n\nAku terdiam. \"Ah. Itu salah satu daerah yang paling parah terkena Banjir Besar.\"\n\n\"Oh...\"\n\n\"Jadi kita harus mengambil jalan memutar yang panjang.\"\n\nKapal bergerak lagi. Semakin jauh kami berlayar, semakin banyak reruntuhan di sekitar kami. Gedung-gedung yang miring, jendela-jendela yang kosong, lumut yang merambat di dinding.\n\n\"Hei, bangunan itu kelihatan agak beda dari yang lain,\" kata Lilly sambil menunjuk. \"Kayak... masih ada bekas kehidupan.\"\n\n\"Lima tahun lalu, masih ada orang yang tinggal di sini...\"\n\n\"Jadi, bangunan ini juga terseret Banjir Besar?\"\n\nAku menggenggam tuas kemudi lebih erat. \"Topan itu... jauh lebih dahsyat dari yang diperkirakan siapa pun. Gelombang badainya menjebol... Dalam hitungan detik, air laut...\"\n\nSuaraku terhenti. Lilly tidak mendesak. Ia hanya menunggu, dan tiba-tiba semuanya kembali.\n\n## Lima Tahun Lalu: Hari Badai\n\nSuara penyiar berita terdengar dari televisi di ruang tamu.\n\n\"Siklon tropis yang diperkirakan akan melemah, kini berkembang pesat menjadi topan hanya dalam hitungan jam. Terlebih lagi, angin barat yang bertiup bertabrakan dengan sistem tekanan tinggi di atas wilayah ini, sehingga jalur prakiraan melebar secara signifikan dan membuat lintasannya sulit diprediksi.\"\n\nHujan menghantam jendela tanpa henti. Aku mendesah. *Hujannya deras banget di luar... Urgh, aku bosan sekali...*\n\n\"Sorana, bisa ke sini sebentar?\"\n\nIbu berdiri di ambang pintu dengan wajah serius. \"Ibu mau kamu mengemas barang-barangmu supaya kita bisa berangkat.\"\n\n\"Boleh bawa banyak?\"\n\n\"Beberapa barang, ya. Tapi ingat, nyawamu jauh lebih penting daripada semua itu.\"\n\n\"Bagaimana dengan Mama Lina? Bukannya dia sedang di tempat kerja?\"\n\n\"Kita akan menjemputnya dari sana.\"\n\nMobil kami melaju di jalan yang tergenang. Namun tak lama, sebuah suara dari pengeras suara menghentikan kami.\n\n\"Mohon maaf, jalan ini ditutup karena banjir. Anda harus memutar balik.\"\n\n\"Apa?! Tapi makin banyak mobil di belakang kita...\"\n\nSiaran darurat terdengar dari radio mobil. \"Akibat tekanan atmosfer yang rendah dan angin kencang, gelombang badai setinggi lebih dari sembilan meter telah terbentuk. Gelombang terus naik saat ini juga. Ketinggiannya sudah melampaui batas rancangan tanggul, sehingga menimbulkan risiko besar. Segera mengungsi ke gedung bertingkat tinggi yang aman.\"\n\n\"O-oke... Eeek, dingin banget! Tunggu, itu... air?!\"\n\n\"Pegang tangan Ibu!\"\n\n## Menuju Menara\n\n\"Oh, kasihan sekali kamu,\" suara Lilly menarikku kembali. \"Kalau ini terlalu berat untukmu, kita bisa putar balik, kok...\"\n\nAku mengerjap. Kapal masih meluncur tenang di atas air, matahari bersinar seperti biasa.\n\n\"A-anyway,\" kataku cepat-cepat, \"sepertinya kita hampir sampai. Lihat itu? Itu dia!\"\n\n\"Ya ampun, iya! Menara radionya keren banget! Pasti kelihatan hebat di videoku!\"\n\nDi depan kami, menara radio itu berdiri menjulang dari atas permukaan laut, bayangannya memanjang di atas air."}, {"title": "Manusia Ikan Menara Radio", "tone": "night", "synopsis": "Siaran di kaki menara, bisikan dari kegelapan, dan seekor makhluk putih yang menawarkan satu permohonan.", "body": "## Siaran dari Kaki Menara\n\nKapal selam kami berhenti mengambang di dekat kaki menara radio yang menjulang dari permukaan laut. Lilly sudah mengarahkan kameranya ke atas dan berseru riang.\n\n\"Kalian lihat ini, nggak?! Ini menara radio yang kuceritakan tadi! Keren banget, kan?\"\n\nIa memutar badan, rambut merah mudanya berayun. \"Oke, sebentar lagi kita mulai pencarian manusia ikan. Tapi sebelum berangkat, bagaimana kalau kita dengar beberapa patah kata dari MVP sejati hari ini, pemanduku! Nah, Sorana, perasaanmu soal laut ini bagaimana?\"\n\nAku tersentak. \"A-aku masih harus melakukan beberapa penyesuaian pada kapal selamnya...\"\n\n\"Kalau begitu, kita ketemu di sana, ya!\" kata Lilly sambil melambaikan tangan ke kamera.\n\nBegitu ia berbalik, aku menghela napas panjang. *(Ugh, kenapa aku selalu kaku begini kalau bicara dengannya?)*\n\n*(Dari semua orang di planet ini, Lilly memilih menyewaku. Aku seharusnya mendukungnya, bukan malah jadi beban.)*\n\n*(...apa aku benar-benar pantas ikut dalam siarannya?)*\n\n## Suara dari Kegelapan\n\nTiba-tiba dunia di sekitarku meredup. Warna biru langit, riak air, bahkan suara Lilly, semuanya lenyap seperti ditelan tinta hitam. Dalam kegelapan itu, sebuah suara berbisik, dingin dan penuh ejekan.\n\n*\"Kau tidak pantas sedekat itu dengannya...\"*\n\n*\"Atau kau berhasil menipu dirimu sendiri? Kau pikir kau benar-benar...\"*\n\n*\"Bwahahaha! Apa kau sungguh sepercaya diri itu? Bahwa kau dan dia...\"*\n\n*\"Biar kuberi tahu sesuatu. Kau tidak akan pernah bisa menyamainya.\"*\n\n*\"Ulangi setelah aku. Tanamkan ke dalam tempurung kepalamu yang tebal itu.\"*\n\n*\"Tidak ada yang mencintaimu. Kau sendirian. Kau tidak berharga. Sama sekali tidak berharga.\"*\n\nBibirku bergerak sendiri. \"Aku... tidak berharga. Sama sekali...\"\n\nSuara itu ada di dalam kepalaku, atau mungkin di sekelilingku, aku tak bisa membedakannya. Dan bisikannya terus menekan, makin dalam, makin keras, mendorongku untuk menghilang dan menghapus diriku dari dunia ini.\n\nLalu, dari kejauhan, terdengar suara lain.\n\n\"Sorana!\"\n\n## Gadis Ajaib\n\n\"Sorana! Aku datang untuk menyelamatkanmu!\"\n\nKegelapan itu retak. Laut abu-abu dan reruntuhan menara yang miring muncul kembali di sekelilingku, dan seseorang menarikku erat ke dalam pelukannya. *Lilly... Lilly memelukku dengan kedua tangannya, dan...*\n\nTapi ia bukan lagi Lilly yang tadi. Pakaiannya putih dengan aksen merah muda menyala, bahunya dihiasi hiasan besar yang berkilau, dan matanya memancarkan tekad yang belum pernah kulihat di siarannya.\n\n\"Oke, kurasa kita sudah agak aman di sini,\" katanya sambil mengamati sekeliling. \"Kamu tidak apa-apa?\"\n\n\"Aaah... a-apa itu? Apa itu Gadis Ajaib? Soalnya kamu kelihatan keren banget sekarang...\"\n\n\"Izinkan saya menjelaskan,\" sebuah suara menyela.\n\nAku menoleh. Di atas puing, seekor makhluk putih mungil duduk dengan tenang. Telinga panjang menjuntai dari kepalanya, matanya merah dan tak berkedip.\n\n\"Makhluk apa itu?! Ada telinga yang keluar dari... Ah, jadi kamu semacam maskot atau semacamnya?\"\n\n\"Kalau itu cara Anda memilih menafsirkannya, silakan,\" jawabnya datar. \"Aku adalah Kyubey. Aku akan mengabulkan satu permohonan apa pun untukmu. Jika kau membuat kontrak denganku dan menjadi Gadis Ajaib...\"\n\n\"T-tunggu, tunggu, tunggu! Semua ini terjadi terlalu cepat!\"\n\n\"Hati-hati,\" potong Kyubey. \"Sang Penyihir sedang mendekat.\"\n\n## Penyihir\n\nAir laut bergelombang pelan di sekitar kami, dan dari dalamnya sesuatu yang besar bergerak.\n\n\"Itu apa?\" bisikku.\n\n\"Gabungan dari kutukan, kebencian, dan emosi negatif,\" kata Kyubey. \"Itulah Penyihir.\"\n\n\"Dan tugasku adalah mengalahkannya!\" Lilly mengepalkan tangan. \"Aku ini kira-kira seperti pahlawan super!\"\n\nAku menatapnya dengan mulut terbuka. *Selebriti favoritku kebetulan berubah jadi Gadis Ajaib dan menyelamatkanku dari kematian? Ini pasti mimpi. Atau delusi. Atau keinginan rahasia dari alam bawah sadarku.*\n\n\"Apa ini seperti saat hidup seseorang berkelebat di depan matanya? Apa aku sudah mati?\"\n\n\"Ini bukan mimpi, bukan delusi, dan bukan permainan alam bawah sadarmu,\" jawab Kyubey. \"Dan tidak, kau tidak mati.\"\n\n\"Kalian berdua memiliki kemampuan bawaan untuk menciptakan energi emosional dalam bentuk sihir. Begitu berkontrak, kalian dapat membengkokkan hukum fisika. Hasil dari keajaiban dan permohonan, bisa dibilang begitu.\"\n\n\"Sihir Lilly adalah manipulasi gelombang otak, yang kurang cocok untuk bertarung. Sihir seorang Gadis Ajaib ditentukan oleh permohonan yang ia buat saat berkontrak. Permohonan Lilly adalah: *aku ingin menjadi streamer nomor satu di seluruh tata surya.*\"\n\nAku belum sempat mencerna semuanya ketika Lilly melompat maju menghadapi bayangan besar itu.\n\n\"Lilly, jangan!\"\n\nAir laut menyembur tinggi. Sosok putih merah muda itu lenyap di dalam pusaran.\n\n\"Oh tidak! Dia terseret ke bawah air!\"\n\n## Tawaran Kyubey\n\nAku jatuh berlutut di atas puing, napas tersengal. Di hadapanku, Kyubey menatap dengan mata merahnya yang tak berubah.\n\n\"Sorana. Kau pun memiliki potensi untuk menjadi Gadis Ajaib.\"\n\nGelombang menggulung pelan di bawah kaki kami.\n\n\"Buat kontrak denganku dan jadilah Gadis Ajaib.\""}, {"title": "Permohonan di Dasar Laut", "tone": "night", "synopsis": "Sebuah lompatan ke laut, satu permohonan, dan cahaya biru yang mengubah segalanya.", "body": "## Air yang Terasa Salah\n\nAku menatap permukaan laut yang bergolak. Ada sesuatu yang tidak beres dengan air ini. Warnanya, gelombangnya, cara ia bergerak, semuanya terasa salah.\n\n\"Air ini kenapa, sih?! Rasanya aneh banget!\"\n\n*Apa yang akan terjadi pada Lilly?*\n\nTanganku gemetar. Di hadapanku, Kyubey masih menunggu dengan sabar.\n\n\"Aku berbicara padamu secara telepati,\" katanya tenang, seakan waktu di sekitar kami berhenti. \"Tidak ada yang akan terdengar oleh orang lain.\"\n\nAku memakai masker selam dan perlengkapanku dengan tangan yang lihatan berbeda.\"\n\n\"Oh, um, i-ini agak canggung... A-aku bisa jelaskan...\"\n\n\"Wah, kamu juga Gadis Ajaib sekarang?!\" Mata Lilly berbinar. \"Kita berdua bersama pasti tak terkalahkan!\"\n\n\"Heh heh... kamu bikin aku malu...\"\n\n## Batu Jiwa\n\nAku memperhatikan benda bercahaya yang kini terpasang di tanganku. \"Benda ini? Aneh, kelihatannya...\"\n\n\"Itu Soul Gem-mu,\" kata Lilly. \"Setiap kali kamu memakai sihirmu, Soul Gem itu akan ternoda. Karena itu kita harus membersihkannya. Kalau tidak, Penyihir lain bisa menetas dari sini.\"\n\nAku mengangguk, masih setengah melayang di antara takjub dan tak percaya. Lalu satu pertanyaan muncul.\n\n\"Oke, sekarang kita sudah mengurus urusan Gadis Ajaib ini,\" kata Lilly, \"tapi apakah Penyihir tadi itu... manusia ikan menara radio?\"\n\n\"Hampir seperti ada Labirin lain yang terbentuk,\" potong Kyubey.\n\nAku melompat. \"Aaah! Makhluk putih apa itu?!\"\n\n\"Aku belum pernah mengamati sesuatu seperti ini sebelumnya,\" gumam Kyubey, matanya yang merah menatap jauh ke arah laut."}, {"title": "Labirin Berkabut", "tone": "labyrinth", "synopsis": "Dunia abu-abu, hutan manik berwajah mulut, dan rantai yang merayap dari balik kabut.", "body": "## Terbangun di Dunia Abu-abu\n\n\"Mreow, mreow, mreehmmm? Huh? Sudah waktunya kerja?\"\n\nAku mengerjap. Langit di atasku pucat dan kelabu, dan di sekelilingku terbentang hamparan berkabut yang dingin. Sosok putih mungil duduk tak jauh dariku, menatap dengan mata merahnya yang tak berubah.\n\n\"Bagaimana kau bisa tertidur di saat seperti ini?\" tanya Kyubey. \"Tidakkah kau menyadari betapa seriusnya keadaan ini?\"\n\n\"A-aku tidak tidur, kok! Cuma... sebentar...\"\n\n\"Mungkinkah kepalamu terbentur dan ingatanmu rusak? Sorana, fokuskan matamu.\"\n\nAku menggosok mata dan memandang sekeliling. Dan saat itulah aku terkesiap. \"Whoa! Aku bisa melihat jauh lebih jelas!\"\n\n\"Itu berkat sihirmu,\" jelas Kyubey. \"Kau mampu membuat lensa dari air di dalam matamu.\"\n\nAku menatap sekeliling dengan takjub. Dunia abu-abu itu kini terlihat tajam sampai ke ujungnya: deretan tiang kurus seperti pohon yang menjulang di kejauhan, dan kabut tipis yang bergulung pelan di tanah.\n\n## Suara Lilly\n\nDi kejauhan, di balik kabut, aku melihat sesosok kecil berambut merah muda. Lilly. Ia melambai ke arahku dari seberang, tampak sangat jauh.\n\n\"Dia melambai padaku!\"\n\n\"Kau bisa memanggilnya lewat telepati,\" kata Kyubey.\n\nAku menutup mata dan memusatkan pikiran. Seutas garis cahaya tipis terbentang di udara, menghubungkan diriku dengan siluet Lilly. Lalu terdengar suaranya, jernih di dalam kepalaku.\n\n\"Sorana! Kamu dengar aku?\"\n\n\"Aku dengar! Kamu baik-baik saja?\"\n\n\"Aku baik-baik saja! Tapi hati-hati, ya!\"\n\n## Hutan Manik\n\nAku mulai melangkah, mengikuti Kyubey dari dekat. Untuk mencapai menara, kami harus melewati hutan itu terlebih dulu.\n\nSemakin dekat, semakin jelas bahwa tiang-tiang yang kukira pohon itu bukanlah pohon. Permukaannya dihiasi manik-manik besar, dan masing-masing memiliki lubang seperti mulut. Dari beberapa lubang itu menjulur rantai-rantai kecil yang menyeret di atas tanah.\n\nSesuatu yang kecil melintas di dekat kakiku. Secara naluriah aku menginjaknya. Rantai itu tersentak kaget, lalu merayap menaiki batang salah satu manik dan bersembunyi kembali ke dalam mulutnya.\n\n\"Eek!\"\n\nDi seberang sana, suara Lilly kembali masuk lewat telepati. \"Aku melihat sesuatu yang aneh bergerak di bawah sana.\"\n\n\"Mereka tidak kelihatan akan menyerang,\" gumamku. \"Ayo, kita jalan terus.\"\n\n## Rantai-rantai\n\nBeberapa langkah kemudian, sesuatu menyentuh kakiku.\n\n\"Eeek! Ada yang menyentuh kakiku!\"\n\n\"Itu cuma rantai kecil,\" kata Kyubey tenang.\n\n\"Iya, tapi... aku mendengar sesuatu di kejauhan. Seperti suara sesuatu yang jatuh, mungkin?\" Aku menelan ludah. \"Kurasa kita sebaiknya pergi dari sini.\"\n\nBelum sempat aku melangkah, kakiku tertarik keras. \"Aduh! Apa... rantai lagi? Kenapa membelit kakiku?!\"\n\n\"Hati-hati!\" seru Kyubey. \"Masih banyak lagi yang datang!\"\n\nDari balik kabut, rantai demi rantai menjulur dari mulut manik-manik besar itu, merayap di atas tanah, melilit, mengikat. Aku menendang, tetapi mereka terlalu banyak.\n\n\"Wah... sepertinya kita kehabisan akal.\"\n\nDi atas kepalaku, suara jatuh itu semakin dekat."}, {"title": "Gadis Berbaju Hitam", "tone": "labyrinth", "synopsis": "Rantai terputus, dunia terangkat, dan seorang penyelamat dingin yang tak mau menyebut namanya.", "body": "## Rantai yang Memutus\n\nKrrng... krrng... krrng...\n\nBunyi jatuh itu kini terdengar jelas, berat dan berirama, mendekat dari balik kabut.\n\n\"Itu dia, datang!\" seru Kyubey.\n\nRantai-rantai yang melilit kakiku menegang, menarikku ke tanah. Aku mengayunkan tangan, tetapi cahaya biruku terasa terlalu lambat. \"Urgh... dasar tikus tak berguna!\" geramku pada Kyubey, yang hanya menatap tanpa bergeming.\n\nLalu sesuatu melesat melewatiku, hitam dan cepat, dan rantai di kakiku terputus seketika.\n\n\"Eeek! K-kamu memutus rantainya...\"\n\n\"Pegang erat,\" kata sebuah suara di telingaku.\n\n\"P-pegang? Pegang apa?\"\n\nSepasang lengan melingkar di pinggangku, dan dunia terangkat. Tanah menjauh dengan cepat, kabut berputar di bawah kakiku. Aku menjerit.\n\n\"T-t-terbaaang! Aaaahh!\"\n\n## Sosok Berambut Panjang\n\nSetelah beberapa saat, aku berani membuka mata. Di sampingku melayang seorang gadis berambut hitam panjang, berbaju hitam yang terbuka di satu bahu, dengan setangkai mawar merah terselip di rambutnya. Wajahnya dingin, matanya tak menatapku sekali pun.\n\nDi bawah sana, sesuatu yang mengerikan terbentang. Ekor hitam yang tak masuk akal panjangnya melilit menara, merentang jauh melewati cakrawala.\n\nHutan yang tadi kulalui sudah berubah. Hanya tersisa beberapa potongan yang terputus, bergelimpangan di tanah, dan sisa-sisa daging gelap yang bergerak-gerak pelan di belakang kami.\n\n\"Eh, kepala-kepala itu... masih hidup?\" bisikku.\n\nGadis itu mendaratkan kami di tanah yang berkabut. Kakiku goyah, hampir roboh.\n\n\"Y-ya! Kakiku cuma... lemas sebentar, kok!\"\n\nIa tidak menjawab. Ia hanya berdiri dengan punggung tegak dan pandangan lurus ke depan.\n\n*(Dia dingin banget... tapi itu malah bikin aku makin suka!)*\n\n## Kyubey dan Sang Penyelamat\n\nKyubey menghampiri dengan langkah ringan, mata merahnya mengarah pada gadis itu.\n\n\"Kau tampaknya seorang Gadis Ajaib. Namun, aku tidak ingat pernah membuat kontrak denganmu.\"\n\n\"Aku tidak punya apa pun untuk dikatakan padamu,\" jawab gadis itu datar.\n\nKyubey diam. Gadis itu menoleh sedikit ke arahku, tatapannya tetap dingin.\n\n\"Kalau kubiarkan kau pergi, kau akan dalam bahaya.\"\n\nAku mengerjap. Lalu aku menutup mata dan memusatkan pikiran, dan seutas cahaya tipis kembali menghubungkanku dengan Lilly.\n\n\"Sorana! Kamu di mana? Kamu baik-baik saja?\"\n\n\"Aku... aku tidak benar-benar tahu apa yang terjadi, tapi ada seseorang yang baik hati menyelamatkanku.\"\n\n\"Kalau begitu,\" kata gadis berbaju hitam itu pelan, \"aku akan membawamu ke sana.\"\n\nAku membuka mata dan menatapnya. \"A-aku akan ikut! Aku akan melakukan apa pun yang kamu mau! Tinggal bilang saja!\"\n\nIa tidak membalas dan hanya memalingkan wajah ke arah lain dengan alis berkerut sedikit.\n\n*(Bahkan saat dia marah padaku pun... dia tetap keren banget!)*"}, {"title": "Kebenaran tentang Soul Gem", "tone": "pale", "synopsis": "Puncak menara, pintu keluar, dan rahasia Kyubey yang mengubah arti dari seorang Gadis Ajaib.", "body": "## Dalam Dekapan Sang Penyelamat\n\n\"Dan Lilly ada di puncak sana?\" tanyaku sambil mendongak ke menara yang menjulang di balik kabut.\n\nGadis berbaju hitam itu hanya mengangguk tipis tanpa menoleh. Lengannya masih melingkari tubuhku, dan aku bisa merasakan hangat tubuhnya di sela dinginnya kabut.\n\n*(Aneh banget bicara begini sementara aku masih dalam pelukannya...)*\n\nTiba-tiba tanah bergetar pelan. Dari kejauhan, sesuatu bergerak turun dari atas, berderak di antara rangka besi.\n\n\"Oh tidak, ada sesuatu yang datang dari atas? M-musuh lagi?!\"\n\n\"Berhenti panik,\" kata gadis itu datar. \"Itu cuma lift. Pas sekali waktunya.\"\n\nAku menelan ludah dan buru-buru menjaga jarak. \"M-maaf...\"\n\n\"Selama kau tetap dekat denganku,\" ujarnya, \"kau akan baik-baik saja. Putuskan hubungan itu, dan siapa tahu apa yang akan terjadi.\"\n\n## Puncak Menara\n\nLift tua itu membawa kami naik, melewati lapisan demi lapisan struktur besi yang diselimuti kabut putih. Di puncaknya, cahaya terang menyambut kami: lantai retak, dinding kaca besar berlapis kisi baja, dan di dalamnya sebuah bola kaca melayang.\n\nLilly berdiri tak jauh dari sana, memeluk bahunya sendiri. Begitu melihatku, matanya langsung berbinar.\n\n\"Sorana!\"\n\n\"L-Lilly! Kamu baik-baik saja?\"\n\n\"Aku baik-baik saja! Dan jangan khawatir, mereka teman-temanku!\" Lilly menunjuk bola kaca itu dengan senyum lebar. \"Tapi bisakah kalian bantu soal kacanya? Tidak mau pecah.\"\n\nAku mengerjap, lalu menatap gadis berbaju hitam di sampingku. \"A-aku suka hal seperti ini! Aku juga mau coba!\"\n\n\"Kalau begitu, berlatihlah,\" kata gadis itu. \"Kalau kau bisa memikirkannya, sihir bisa mewujudkannya.\"\n\nAku memusatkan pikiran, mengangkat tangan, dan kaca itu mulai retak, lalu pecah berkeping-keping.\n\n\"Wow! Terima kasih banyak, orang baik!\" seru Lilly. Dari dalam bola kaca, sesuatu keluar: makhluk-makhluk kecil berwarna-warni, melayang seperti kunang-kunang yang bahagia.\n\n\"Ini pintu keluarnya,\" kata gadis berbaju hitam. \"Seharusnya mengarah ke tempat kalian berada sebelumnya.\"\n\n\"Yay! Petualangan yang luar biasa!\" Lilly melompat kecil. \"Sorana, itu tadi keren banget, kan?\"\n\nAku menoleh pada gadis itu. \"D-Do you mind kalau aku tanya namamu?\"\n\n\"Tidak ada gunanya aku menyebutkan namaku.\"\n\nKyubey berjalan mendekat, matanya merah menatap tanpa kedip. \"Boleh aku bertanya sesuatu kalau begitu? Kau tampaknya tahu banyak soal tempat ini. Aku sangat curiga pada kalian berdua dan pada Labirin ini. Jadi katakan padaku. Apa yang kau sembunyikan?\"\n\n\"Nagiboshi,\" kata gadis itu tanpa menjawabnya, \"sebuah nasihat. Kau akan membutuhkannya.\"\n\nDan ia pun berbalik pergi.\n\n## Tubuh yang Hanya Perangkat Luar\n\nKyubey menatap kepergiannya dengan tenang, lalu berpaling kepada kami berdua.\n\n\"Aku tak punya alasan untuk menyembunyikannya lagi,\" katanya pelan. \"Kami telah mengekstrak jiwa kalian dan membentuknya menjadi Soul Gem.\"\n\n\"HAH?!\" Aku mundur selangkah. \"Lalu bagaimana dengan tubuh kami?\"\n\n\"Tubuh kalian pada dasarnya hanyalah perangkat keras eksternal. Dalam keadaan ini, Soul Gem kalian hanya mampu menggerakkan tubuh itu. Kalian tidak mungkin melawan Penyihir hanya dengan wujud jasmani. Lagi pula, tubuh manusia itu lemah dan rapuh.\"\n\n\"Tapi jika jiwa kalian dijadikan Soul Gem... maka bahkan jika kalian ditusuk di jantung atau otak kalian dihancurkan, kalian tetap bisa terus bertarung.\"\n\n\"Ini salah!\" teriakku. \"Kalian tidak boleh mengutak-atik jiwa orang seenaknya!\"\n\nKyubey tidak bergeming. \"Dan jika Soul Gem itu menjadi sepenuhnya ternoda...\"\n\n\"Jangan...\" bisik Lilly.\n\n\"...Gadis Ajaib itu akan berubah menjadi Penyihir.\"\n\nAku membeku. \"T-tunggu... jadi para Penyihir yang sudah kukalahkan...\"\n\n\"Ya. Mereka dulunya adalah Gadis Ajaib.\"\n\n## Entropi dan Harapan\n\n\"Apakah kau tahu arti kata entropi?\" tanya Kyubey.\n\n\"Seperti hukum kedua termodinamika?\"\n\n\"Bagus. Maka ini akan mudah dijelaskan. Pada akhirnya, alam semesta di masa depan yang jauh akan tersisa dengan energi panas berkualitas rendah yang telah terdisipasi, yang tak punya kegunaan dinamis. Entropi mencapai maksimum, eksergi turun ke nol. Dalam alam semesta seperti itu, tidak akan ada kecerdasan.\"\n\n\"Untuk bertahan, kalian harus mampu membuang entropi ke lingkungan. Namun hal itu mustahil di lingkungan di mana entropi sudah maksimum.\"\n\n\"Itulah sebabnya kami membutuhkan energi yang melampaui efisiensi Carnot, batas yang ditetapkan hukum fisika, demi mengumpulkan energi emosional dengan lebih efisien. Lagi pula, energi emosional yang paling berkualitas adalah yang tercipta dari transisi harapan menjadi keputusasaan, saat seorang Gadis Ajaib menjadi Penyihir.\"\n\n\"Karena itu, masa depan seluruh alam semesta bergantung pada kalian. Alam semesta dan seluruh peradaban yang tak terhitung banyaknya di dalamnya. Seberapa pun kalian ingin membatalkannya sekarang...\"\n\n\"Aku tidak percaya ini!\" Suaraku pecah. \"Kenapa kalian tidak memberitahu kami sebelumnya?!\"\n\n\"Aku tidak memberitahunya karena kalian tidak pernah bertanya.\" Kyubey menegakkan telinganya. \"Jika kau menganggapku tidak menyenangkan, aku akan menghilang dari hadapanmu. Selamat tinggal. Aku ragu kita akan bertemu lagi.\"\n\nKyubey melompat turun dan lenyap ke dalam kabut.\n\nAku terpaku di tempat. Di sampingku, Lilly menggenggam tangannya sendiri dengan erat."}, {"title": "Melangkah Menuju Masa Depan", "tone": "night", "synopsis": "Tagihan dari kapal selam, janji di dermaga, dan satu pertanyaan tentang hari esok.", "body": "## Tagihan dari Kapal Selam\n\nMalam sudah turun ketika kami kembali ke dermaga. Lampu-lampu kota yang tenggelam berpendar biru di antara gedung-gedung berlumut, dan aku berdiri di samping kapal selam itu dengan kedua tangan menekan pelipis.\n\n\"Dongeng absurd macam apa yang Anda bicarakan, Nona Nagiboshi?\" suara Navi terdengar datar. \"Kerusakan di lambung saya itu nyata.\"\n\n\"Itu kan bukan aku yang pegang kemudi waktu kejadian! Aku tidak ada hubungannya dengan itu...\"\n\n\"Pasal dalam kontrak menyebutkan: *Pengguna wajib memberi pertimbangan yang semestinya terhadap keselamatan kapal saat ditambatkan.*\"\n\n\"Ayolah, memangnya kamu pikir aku membaca seluruh kontrak itu?\"\n\n\"Tetap saja, Anda menandatanganinya. Anda wajib membayar kompensasi.\"\n\n\"Itu gila! Dengar, kalau kamu rusak, aku akan menambalmu sendiri, oke?\"\n\n\"Itu sama sekali tidak oke. Cakupan kerusakan saya berada di luar kemampuan amatir seperti Anda.\"\n\nNavi menyebutkan angka kompensasinya. Aku terpaku.\n\n\"Bahkan kalau kujual semua yang kupunya, itu tidak akan mencapai SETENGAHNYA!\"\n\n\"Kegagalan membayar kompensasi sebelum tenggat yang ditentukan...\"\n\n\"Aku sudah muak dengan yang namanya kontrak...\" desahku lirih.\n\n## Lilly dan Siaran yang Batal\n\n\"Sorana!\"\n\nAku menoleh. Lilly berjalan mendekat dengan langkah ringan, rambutnya tertiup angin laut. Ia berhenti di depanku dan tersenyum meminta maaf.\n\n\"Karena itu juga aku tidak bisa siaran hari ini,\" katanya sambil menggaruk pipi. \"Oh, maaf!\"\n\n\"T-tidak apa-apa!\"\n\nLilly menunduk sebentar, lalu menatapku. \"Sorana... kamu menyelamatkanku.\"\n\n*(...demi menyelamatkan Lilly.)*\n\nAku menggeleng pelan. \"Dan jadi... aku tidak menyesal sedikit pun.\"\n\n\"Kalau begitu, ini,\" kata Lilly sambil merogoh sakunya. \"Ambil permen ini. Aku bahkan belum berterima kasih padamu dengan benar.\"\n\nAku menerima permen itu dengan kedua tangan. Rasanya aneh, kecil dan manis di tengah semua yang terjadi hari ini.\n\n## Lima Tahun Setelah Banjir\n\n\"Kamu tahu...\" kataku akhirnya, \"waktu Banjir Besar menerjang lima tahun lalu...\"\n\nLilly mendengarkan tanpa menyela.\n\n\"Aku merasa semuanya sudah berakhir. Dan aku tidak pernah menemukan alasan untuk terus maju. Sampai hari ini.\"\n\n\"Aku juga merasakan hal yang sama, Sorana!\" Lilly tersenyum lebar. \"Dan kalau kita tidak pernah menyerah pada keputusasaan... mungkin kita tidak akan berubah jadi Penyihir!\"\n\n\"Itu pikiran positif yang luar biasa...\"\n\n\"Aku tidak akan membiarkanmu kehilangan harapan, janji!\"\n\n\"Itu baik sekali... Aku akan menghargai kata-kata itu selamanya.\"\n\nBegitu kalimat itu keluar dari mulutku, wajahku terasa panas. \"Aaah! Lupakan apa yang tadi kubilang!\"\n\nLilly tertawa. \"Ayolah, tidak perlu seformal itu padaku!\"\n\n\"T-tapi...\"\n\n\"Mulai sekarang...\" Lilly mengacungkan jarinya ke arahku. \"Kita ini partner!\"\n\n\"L-Lilly, kamu tidak bisa...\"\n\n## Masa Depan yang Tak Pasti\n\nAku menarik napas. \"Dan... kapal selam ini memaksaku membayar kompensasi atas kesalahannya sendiri.\"\n\n\"Wah, jumlahnya berapa?\" tanya Lilly.\n\nAku menyebutkan angkanya. Lilly terdiam sesaat.\n\n\"Aku tidak akan pernah bisa membayarmu kembali, tahu,\" tambahku lirih.\n\nAku menatap langit malam di atas kota tenggelam itu, bintang-bintang berkelip di sela awan. Di sampingku, Lilly sudah kembali bersenandung kecil.\n\n*(Apa yang menantiku di masa depan sekarang?!)*\n\n---\n\n*Bersambung ke Chapter berikutnya...*"}]</script>
<script>
const EPS=JSON.parse(document.getElementById("data").textContent);
const $=s=>document.querySelector(s),app=$("#app"),bar=$("#bar");
let S={fs:21,tone:"auto",font:"game",done:{},pos:{},last:0};
try{Object.assign(S,JSON.parse(localStorage.getItem("sorana")||"{}"))}catch(e){}
const save=()=>{try{localStorage.setItem("sorana",JSON.stringify(S))}catch(e){}};
const esc=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
function scene(tone,first){
 document.body.className=(S.font==="serif"?"serif ":"")+"t-"+tone;
 seed=7;let s="";
 if(tone==="labyrinth"){for(let i=0;i<26;i++){const x=i*48+rnd()*20,h=90+rnd()*190,w=7+rnd()*8;s+=`<rect x="${x}" y="${300-h}" width="${w}" height="${h}" rx="3"/>`;for(let k=0;k<h/34;k++)s+=`<circle cx="${x+w/2}" cy="${300-h+k*34+16}" r="${w*.95}"/>`}}
 else{for(let i=0;i<22;i++){const x=i*56-20+rnd()*16,h=70+rnd()*210,w=34+rnd()*26;s+=`<rect x="${x}" y="${300-h}" width="${w}" height="${h}"/>`;if(tone!=="pale")s+=`<circle cx="${x+w*.35}" cy="${300-h}" r="${w*.3}" fill="#3d6b3a" opacity=".55"/>`}}
 $("#sk").innerHTML=s;$("#sk").classList.toggle("rise",!!first);
 const wave=o=>{let d="M0 50";for(let i=0;i<=24;i++)d+=` L${i*100} ${50+Math.sin(i*1.3+o)*14}`;return d+" L2400 100 L0 100Z"};
 const p=document.querySelectorAll("#wv path");p[0].setAttribute("d",wave(0));p[1].setAttribute("d",wave(2));
 document.querySelectorAll(".bub").forEach(b=>b.remove());
 if((tone==="night"||tone==="sunset")&&!matchMedia("(prefers-reduced-motion:reduce)").matches)for(let i=0;i<7;i++){const b=document.createElement("i");b.className="bub";b.style.left=(8+i*13)+"%";b.style.animationDuration=(14+i*3)+"s";b.style.animationDelay=(-i*4)+"s";document.body.appendChild(b)}
}
const toneFor=ep=>S.tone==="auto"?(ep?ep.tone:"sunset"):S.tone;
function inline(t){return esc(t).replace(/\*([^*]+)\*/g,"<em>$1</em>")}
function body(md){
 return md.split(/\n\s*\n/).map(b=>{b=b.trim();if(!b)return"";
  if(b.startsWith("## "))return`<h2 id="s${++body.n}">${esc(b.slice(3))}</h2>`;
  if(b==="---")return"<hr>";
  if(/^\*.*\*$/.test(b)&&!b.slice(1,-1).includes("*"))return`<p class="t">${inline(b.slice(1,-1))}</p>`;
  return`<p class="${b.startsWith('"')?"d":""}">${inline(b)}</p>`}).join("");
}
function home(){
 bar.hidden=true;closePanels();scene(toneFor(null),true);document.title="Sorana Magica: Memori Sorana Nagiboshi";
 const nDone=EPS.filter((e,i)=>S.done[i]).length,last=Math.min(S.last||0,EPS.length-1),started=S.pos[last]>0.01||nDone>0;
 app.innerHTML=`<section class="hero"><p>Memori Sorana Nagiboshi, Bumi</p><h1>Sorana Magica</h1><p>Chapter 1: Laut. Sepuluh episode tentang kota yang tenggelam, seorang penyelam, dan satu permohonan.</p><button class="btn main" id="go">${started?"Lanjutkan Episode "+(last+1):"Mulai membaca"}</button></section><ol class="list">${EPS.map((e,i)=>`<li><button class="ep ${S.done[i]?"done":""}" data-i="${i}"><span class="n">${i+1}</span><span><b>${esc(e.title)}</b><small>${esc(e.synopsis)}</small></span><span class="st">${S.done[i]?"Selesai":S.pos[i]>0.02?Math.round(S.pos[i]*100)+"% terbaca":"Belum dibaca"}</span></button></li>`).join("")}</ol>`;
 $("#go").onclick=()=>{location.hash="#/ep/"+(last+1)};
 app.querySelectorAll(".ep").forEach(b=>b.onclick=()=>{location.hash="#/ep/"+(+b.dataset.i+1)});
 window.scrollTo(0,0);
}
function reader(i){
 const e=EPS[i];S.last=i;save();closePanels();bar.hidden=false;scene(toneFor(e),false);body.n=0;
 document.title=`Episode ${i+1}: ${e.title} | Sorana Magica`;$("#bTtl").textContent=`Episode ${i+1}: ${e.title}`;
 app.innerHTML=`<article><header><small>Episode ${i+1} dari ${EPS.length}</small><h1>${esc(e.title)}</h1></header>${body(e.body)}</article><div class="end"><p>${i<EPS.length-1?"Episode "+(i+1)+" selesai.":"Itulah akhir Chapter 1."}</p><div class="row">${i>0?`<button class="btn" id="pv">Episode sebelumnya</button>`:""}${i<EPS.length-1?`<button class="btn main" id="nx">Episode berikutnya</button>`:`<button class="btn main" id="hm">Kembali ke daftar</button>`}</div></div>`;
 $("#toc").innerHTML="<h3>Bagian episode ini</h3>"+[...app.querySelectorAll("h2")].map(h=>`<a href="#" data-t="${h.id}">${h.textContent}</a>`).join("")+"<h3 style='margin-top:1rem'>Loncat ke episode</h3>"+EPS.map((x,k)=>`<a href="#/ep/${k+1}">${k+1}. ${esc(x.title)}</a>`).join("");
 $("#toc").querySelectorAll("[data-t]").forEach(a=>a.onclick=ev=>{ev.preventDefault();document.getElementById(a.dataset.t).scrollIntoView();closePanels()});
 if($("#pv"))$("#pv").onclick=()=>location.hash="#/ep/"+i;
 if($("#nx"))$("#nx").onclick=()=>location.hash="#/ep/"+(i+2);
 if($("#hm"))$("#hm").onclick=()=>location.hash="#/";
 const r=S.pos[i]||0;requestAnimationFrame(()=>{const m=document.documentElement.scrollHeight-innerHeight;window.scrollTo({top:r>0.01&&r<0.97?m*r:0,behavior:"instant"});prog()});
}
function prog(){
 const m=document.documentElement.scrollHeight-innerHeight,p=m>0?Math.min(1,Math.max(0,scrollY/m)):1,i=S.last;
 $("#gr").setAttribute("y",100-p*100);$("#gr").setAttribute("height",p*100);$("#pct").textContent=Math.round(p*100)+"%";
 if(!bar.hidden){S.pos[i]=p;if(p>=.97)S.done[i]=true;clearTimeout(prog.t);prog.t=setTimeout(save,300)}
}
addEventListener("scroll",()=>{if(!bar.hidden)requestAnimationFrame(prog)},{passive:true});
function route(){const m=location.hash.match(/^#\/ep\/(\d+)/);m&&EPS[m[1]-1]?reader(m[1]-1):home()}
addEventListener("hashchange",route);
function closePanels(){["toc","set"].forEach(id=>$("#"+id).hidden=true);$("#bToc").setAttribute("aria-expanded","false");$("#bSet").setAttribute("aria-expanded","false")}
function toggle(id,btn){const el=$("#"+id),open=el.hidden;closePanels();el.hidden=!open;$(btn).setAttribute("aria-expanded",open)}
$("#bHome").onclick=()=>location.hash="#/";$("#bToc").onclick=()=>toggle("toc","#bToc");$("#bSet").onclick=()=>toggle("set","#bSet");
function applySet(){
 document.documentElement.style.setProperty("--fs",S.fs+"px");
 document.querySelectorAll("#gTone .btn").forEach(b=>b.setAttribute("aria-pressed",b.dataset.tone===S.tone));
 document.querySelectorAll("#gFont .btn").forEach(b=>b.setAttribute("aria-pressed",(b.dataset.font==="serif")===(S.font==="serif")));
}
document.querySelectorAll("[data-fs]").forEach(b=>b.onclick=()=>{const v=+b.dataset.fs;S.fs=v===0?21:Math.min(32,Math.max(15,S.fs+v*2));applySet();save()});
document.querySelectorAll("[data-tone]").forEach(b=>b.onclick=()=>{S.tone=b.dataset.tone;applySet();save();route()});
document.querySelectorAll("[data-font]").forEach(b=>b.onclick=()=>{S.font=b.dataset.font;applySet();save();document.body.classList.toggle("serif",S.font==="serif")});
addEventListener("keydown",ev=>{
 if(ev.key==="Escape")closePanels();
 const m=location.hash.match(/^#\/ep\/(\d+)/);if(!m||ev.metaKey||ev.ctrlKey||ev.altKey)return;const n=+m[1];
 if(ev.key==="ArrowRight"&&n<EPS.length)location.hash="#/ep/"+(n+1);
 if(ev.key==="ArrowLeft"&&n>1)location.hash="#/ep/"+(n-1);
});
applySet();route();
</script>
</body>
</html>
